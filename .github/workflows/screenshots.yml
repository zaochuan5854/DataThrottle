name: Capture Screenshots

# ─── Triggers ──────────────────────────────────────────────────────────────────
# Manual only — run when you want to regenerate README screenshots.
# Trigger via: GitHub UI → Actions → Capture Screenshots → Run workflow
on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Screengrab on Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # required to push the screenshot commit

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ──────────────────────────────────────────────────────────────────
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # ── Ruby + Fastlane ───────────────────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true   # runs `bundle install` automatically

      # ── Gradle cache ──────────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Build APKs (before emulator boots to save time) ───────────────────────
      - name: Build debug APK + test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      # ── Enable KVM (hardware acceleration for the emulator) ───────────────────
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ── Launch emulator + run Screengrab ──────────────────────────────────────
      - name: Run Screengrab on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          target: google_apis
          avd-name: screengrab_avd
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true   # removes flicker / animation jitter in screenshots
          script: bundle exec fastlane screenshots

      # ── Commit & push generated screenshots ───────────────────────────────────
      - name: Commit screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate screenshots [skip ci]"
          file_pattern: "artworks/screenshots/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      # ── Upload as artifact (always, even if commit step is skipped) ───────────
      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: artworks/screenshots/
          retention-days: 30
