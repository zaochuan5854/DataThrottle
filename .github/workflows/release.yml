name: Release

on:
  push:
    tags:
      - 'v*'   # e.g. v1.2.0, v2.0.0-rc1

jobs:
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git describe

      # ──────────────────────────────────────────────
      # バージョンを git タグから自動抽出
      # e.g. refs/tags/v1.2.0 → VERSION_NAME=1.2.0, VERSION_CODE=10200
      # ──────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "VERSION_NAME=$TAG" >> "$GITHUB_OUTPUT"
          # Convert semver to integer versionCode: 1.2.3 → 10203  (max patch 99)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG%%-*}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Tag: v$TAG  →  versionCode: $VERSION_CODE"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ──────────────────────────────────────────────
      # Release 署名用キーストアのセットアップ (Secrets 必須)
      # ──────────────────────────────────────────────
      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::❌ Release build failed: Required GitHub Secrets for signing are missing!"
            echo "Please configure the following Repository Secrets in Settings > Secrets and variables > Actions:"
            echo "  - KEYSTORE_BASE64"
            echo "  - STORE_PASSWORD"
            echo "  - KEY_ALIAS"
            echo "  - KEY_PASSWORD"
            exit 1
          fi

          echo "Setting up production keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
          echo "KEYSTORE_FILE=$HOME/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      # ──────────────────────────────────────────────
      # Unit Tests (リリース前にも必ず実行)
      # ──────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # ──────────────────────────────────────────────
      # Release Build (Signed via Gradle signingConfig)
      # ──────────────────────────────────────────────
      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}" \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.VERSION_CODE }}" \
            --stacktrace

          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/DataThrottle-v${{ steps.version.outputs.VERSION_NAME }}.apk"

      # ──────────────────────────────────────────────
      # GitHub Releases に 署名付き APK をアップロード
      # ──────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DataThrottle v${{ steps.version.outputs.VERSION_NAME }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: app/build/outputs/apk/release/DataThrottle-v${{ steps.version.outputs.VERSION_NAME }}.apk
          body: |
            ## DataThrottle v${{ steps.version.outputs.VERSION_NAME }}

            ### Installation
            Download the signed APK (`DataThrottle-v${{ steps.version.outputs.VERSION_NAME }}.apk`) below and install it directly on your Android device (Android 13+).

            ```bash
            adb install DataThrottle-v${{ steps.version.outputs.VERSION_NAME }}.apk
            ```
